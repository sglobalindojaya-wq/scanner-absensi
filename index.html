    const faceCanvas = document.getElementById('faceCanvas');

// =====================================
// RESET RIWAYAT PANEL FOTO SETIAP 12 JAM
// Hanya membersihkan pesan yang sudah selesai/gagal.
// Upload yang masih berjalan tidak pernah dihapus.
// =====================================
const PHOTO_HISTORY_RESET_KEY = 'absensi_photo_history_reset_at';
const PHOTO_HISTORY_INTERVAL = 12 * 60 * 60 * 1000;

function ensureQueueEmptyMessage() {
  const queue = document.getElementById('photoQueue');
  if (!queue.querySelector('.chat-message') &&
      !queue.querySelector('.queue-empty')) {
    const empty = document.createElement('div');
    empty.className = 'queue-empty';
    empty.id = 'queueEmpty';
    empty.innerHTML = 'Belum ada foto yang diproses.<br>Setelah karyawan scan QR, status foto akan muncul di sini.';
    queue.appendChild(empty);
  }
}

function resetCompletedPhotoHistory() {
  const queue = document.getElementById('photoQueue');
  if (!queue) return;

  // Pesan aktif (mengambil foto/mengunggah/mencoba ulang) dipertahankan.
  queue.querySelectorAll('.chat-message').forEach(item => {
    const state = item.querySelector('.upload-state');
    if (state && (state.classList.contains('done') ||
                  state.classList.contains('failed'))) {
      item.remove();
    }
  });

  localStorage.setItem(PHOTO_HISTORY_RESET_KEY, String(Date.now()));
  ensureQueueEmptyMessage();
  updateQueueSummary();
}

function initializePhotoHistoryReset() {
  let lastReset = 0;
  try {
    lastReset = Number(localStorage.getItem(PHOTO_HISTORY_RESET_KEY) || 0);
  } catch (e) {}

  if (!lastReset) {
    try { localStorage.setItem(PHOTO_HISTORY_RESET_KEY, String(Date.now())); } catch (e) {}
  } else if (Date.now() - lastReset >= PHOTO_HISTORY_INTERVAL) {
    resetCompletedPhotoHistory();
  }

  // Pemeriksaan setiap menit agar reset tetap terjadi saat halaman terbuka.
  setInterval(() => {
    let saved = 0;
    try { saved = Number(localStorage.getItem(PHOTO_HISTORY_RESET_KEY) || 0); } catch (e) {}
    if (!saved || Date.now() - saved >= PHOTO_HISTORY_INTERVAL) {
      resetCompletedPhotoHistory();
    }
  }, 60 * 1000);
}

async function captureFacePhoto() {
  if (isCapturingFace) {
    throw new Error('Kamera sedang mengambil foto.');
  }

  isCapturingFace = true;

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Browser tidak mendukung akses kamera.');
    }

    showMessage('MEMBUKA KAMERA DEPAN...', 'loading');

    faceStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'user' },
        width: { ideal: 320 },
        height: { ideal: 240 }
      },
      audio: false
    });

    faceCamera.srcObject = faceStream;
    faceCamera.style.display = 'block';

    await faceCamera.play();

    // Tunggu sampai kamera menghasilkan gambar.
    await new Promise((resolve, reject) => {
      const start = Date.now();

      function checkCamera() {
        if (
          faceCamera.readyState >= 2 &&
          faceCamera.videoWidth > 0 &&
          faceCamera.videoHeight > 0
        ) {
          resolve();
          return;
        }

        if (Date.now() - start > 10000) {
          reject(new Error('Kamera depan gagal menghasilkan gambar.'));
          return;
        }

        requestAnimationFrame(checkCamera);
      }

      checkCamera();
    });

    showMessage('MENGAMBIL FOTO WAJAH...', 'loading');

    const context = faceCanvas.getContext('2d');

    faceCanvas.width = faceCamera.videoWidth;
    faceCanvas.height = faceCamera.videoHeight;

    context.drawImage(
      faceCamera,
      0,
      0,
      faceCanvas.width,
      faceCanvas.height
    );

    const imageData = faceCanvas.toDataURL('image/jpeg', 0.4);

    if (!imageData || imageData.length < 1000) {
      throw new Error('Foto gagal dibuat.');
    }

    return imageData;

  } finally {
    if (faceStream) {
      faceStream.getTracks().forEach(track => track.stop());
      faceStream = null;
    }

    faceCamera.srcObject = null;
    faceCamera.style.display = 'none';
    isCapturingFace = false;
  }
}
function addPhotoQueueItem(response) {
  const empty = document.getElementById('queueEmpty');
  if (empty) empty.remove();

  const item = document.createElement('div');
  item.className = 'chat-message';
  item.id = 'photo-' + response.requestId;

  const name = document.createElement('div');
  name.className = 'employee-name';
  name.textContent = response.name || 'Karyawan';

  const meta = document.createElement('div');
  meta.className = 'message-meta';
  meta.textContent = (response.activity || '-') + ' · ' +
    (response.time || '-') + ' · ' + (response.date || '-');

  const state = document.createElement('div');
  state.className = 'upload-state';
  state.id = 'photo-state-' + response.requestId;
  state.textContent = 'Menunggu pengambilan foto...';

  item.appendChild(name);
  item.appendChild(meta);
  item.appendChild(state);

  const queue = document.getElementById('photoQueue');
  queue.appendChild(item);
  queue.scrollTop = queue.scrollHeight;
  updateQueueSummary();
  return item;
}

function updatePhotoState(requestId, message, type) {
  const state = document.getElementById('photo-state-' + requestId);
  if (!state) return;

  state.className = 'upload-state' + (type ? ' ' + type : '');
  state.textContent = message;
  updateQueueSummary();
}

function updateQueueSummary() {
  const states = Array.from(
    document.querySelectorAll('#photoQueue .upload-state')
  );
  const done = states.filter(el => el.classList.contains('done')).length;
  const failed = states.filter(el => el.classList.contains('failed')).length;
  const running = states.length - done - failed;

  document.getElementById('queueSummary').textContent =
    states.length + ' foto · ' + running + ' diproses · ' +
    done + ' berhasil · ' + failed + ' perlu diperiksa';
}

function checkPhotoStatus(requestId, token) {
  return new Promise((resolve, reject) => {
    const callbackName = 'photoStatus_' +
      String(requestId).replace(/[^a-zA-Z0-9_$]/g, '') +
      '_' + Date.now();

    const script = document.createElement('script');
    let settled = false;

    const finish = (fn, value) => {
      if (settled) return;
      settled = true;
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
      fn(value);
    };

    const timeout = setTimeout(() => {
      finish(reject, new Error('Konfirmasi server foto timeout.'));
    }, 10000);

    window[callbackName] = result => finish(resolve, result);

    const params = new URLSearchParams({
      action: 'photostatus',
      requestId: requestId,
      token: token,
      callback: callbackName
    });

    script.src = SCRIPT_URL + '?' + params.toString();
    script.onerror = () => finish(
      reject,
      new Error('Gagal memeriksa status foto.')
    );
    document.body.appendChild(script);
  });
}

function submitPhotoInBackground(imageData, requestId, token) {
  const iframe = document.createElement('iframe');
  const frameName = 'photoUpload_' + requestId;
  iframe.name = frameName;
  iframe.style.display = 'none';

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = SCRIPT_URL;
  form.target = frameName;
  form.enctype = 'application/x-www-form-urlencoded';
  form.style.display = 'none';

  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'payload';
  input.value = JSON.stringify({
    action: 'uploadPhoto',
    requestId: requestId,
    token: token,
    imageData: imageData
  });
  form.appendChild(input);

  document.body.appendChild(iframe);
  document.body.appendChild(form);
  form.submit();

  return { iframe, form };
}

async function runPhotoUpload(imageData, requestId, token, attempt) {
  const maxAttempts = 3;
  updatePhotoState(
    requestId,
    attempt === 1
      ? 'Mengunggah foto...'
      : 'Mencoba mengirim ulang (' + attempt + '/' + maxAttempts + ')...',
    ''
  );

  let uploadElements;
  try {
    uploadElements = submitPhotoInBackground(
      imageData,
      requestId,
      token
    );

    // Polling berjalan sendiri; tidak ditunggu oleh scanner.
    for (let check = 0; check < 12; check++) {
      await new Promise(resolve => setTimeout(resolve, 3000));

      let result;
      try {
        result = await checkPhotoStatus(requestId, token);
      } catch (statusError) {
        // Gangguan sesaat saat mengecek status tidak langsung
        // dianggap gagal; lanjutkan pemeriksaan.
        continue;
      }

      if (result && result.success) {
        updatePhotoState(requestId, '✓ Foto berhasil tersimpan di Google Drive.', 'done');
        return;
      }

      if (
        result &&
        result.message &&
        result.message !== 'Foto belum tersimpan.'
      ) {
        throw new Error(result.message);
      }
    }

    throw new Error('Belum ada konfirmasi dari Google Drive.');
  } catch (error) {
    if (attempt < maxAttempts) {
      updatePhotoState(
        requestId,
        'Upload belum berhasil. Sistem akan mencoba ulang...',
        ''
      );
      await new Promise(resolve => setTimeout(resolve, 2000));
      return runPhotoUpload(imageData, requestId, token, attempt + 1);
    }

    updatePhotoState(
      requestId,
      '✕ Gagal mengunggah setelah 3 percobaan: ' +
        (error.message || 'Periksa koneksi dan folder Drive.'),
      'failed'
    );
  } finally {
    if (uploadElements) {
      uploadElements.form.remove();
      uploadElements.iframe.remove();
    }
  }
}

function startBackgroundPhotoUpload(imageData, requestId, token) {
  // Sengaja tidak menggunakan await. Proses upload tidak menahan scanner.
  runPhotoUpload(imageData, requestId, token, 1);
}


// =====================================
// TAMPILAN STATUS
    // =====================================

    function showMessage(message, type) {
      statusBox.className = type;
      statusBox.textContent = message;
    }

    let attendanceToastTimer = null;

    function showAttendanceNotification(title, detail, type) {
      const toast = document.getElementById('attendanceToast');
      if (!toast) return;

      toast.className = type || 'success';
      toast.replaceChildren();

      const titleNode = document.createElement('span');
      titleNode.className = 'toast-title';
      titleNode.textContent = title;

      const detailNode = document.createElement('span');
      detailNode.className = 'toast-detail';
      detailNode.textContent = detail || '';

      toast.appendChild(titleNode);
      toast.appendChild(detailNode);
      toast.classList.add('show');

      if (attendanceToastTimer) clearTimeout(attendanceToastTimer);
      attendanceToastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 5000);
    }

    // =====================================
    // DECODE EMAIL UNTUK TAMPILAN
    // VERIFIKASI ASLI TETAP DI SERVER
    // =====================================

    function getEmailFromCredential(jwt) {
      try {
        const payload = jwt.split('.')[1];
        const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
        const decoded = atob(normalized);
        const bytes = Uint8Array.from(decoded, c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes)).email || '';
      } catch (error) {
        return '';
      }
    }

    // =====================================
    // LOGIN GOOGLE
    // =====================================

    function initializeGoogleLogin() {
      if (!window.google || !google.accounts) {
        setTimeout(initializeGoogleLogin, 500);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleLogin,
        auto_select: true
      });

      // Pulihkan sesi dari tab yang sama setelah halaman di-refresh.
      // Token tetap diverifikasi ulang oleh server saat scan.
      restoreGoogleSession();

      google.accounts.id.renderButton(
        document.getElementById('googleLogin'),
        {
          theme: 'outline',
          size: 'large',
          shape: 'rectangular',
          text: 'signin_with',
          width: 280
        }
      );
    }

    function handleGoogleLogin(response) {
      const credential = response.credential;
      const email = getEmailFromCredential(credential).toLowerCase();

      if (email !== OFFICIAL_EMAIL) {
        googleIdToken = '';
        startButton.disabled = true;

        accountInfo.textContent = 'Akun tidak diizinkan: ' + (email || 'tidak diketahui');

        showMessage(
          'LOGIN DITOLAK!\nGunakan akun ' + OFFICIAL_EMAIL,
          'error'
        );
        return;
      }

      googleIdToken = credential;

      try {
        sessionStorage.setItem('absensi_google_id_token', credential);
      } catch (storageError) {
        // Login tetap dapat dipakai selama halaman tidak di-refresh.
      }

      accountInfo.textContent = 'Login sebagai: ' + email;
      startButton.disabled = false;
      document.getElementById('googleLogin').style.display = 'none';

      showMessage(
        'LOGIN BERHASIL.\nMemeriksa antrean absensi...',
        'success'
      );
      syncPendingAttendanceQueue();
    }

    function restoreGoogleSession() {
      let savedToken = '';

      try {
        savedToken = sessionStorage.getItem('absensi_google_id_token') || '';
      } catch (storageError) {
        savedToken = '';
      }

      if (!savedToken) return;

      const email = getEmailFromCredential(savedToken).toLowerCase();

      let payload = {};
      try {
        const part = savedToken.split('.')[1];
        const normalized = part.replace(/-/g, '+').replace(/_/g, '/');
        const decoded = atob(normalized);
        const bytes = Uint8Array.from(decoded, c => c.charCodeAt(0));
        payload = JSON.parse(new TextDecoder().decode(bytes));
      } catch (error) {
        payload = {};
      }

      const stillValid = Number(payload.exp || 0) >
        Math.floor(Date.now() / 1000);

      if (email !== OFFICIAL_EMAIL || !stillValid) {
        try {
          sessionStorage.removeItem('absensi_google_id_token');
        } catch (storageError) {}
        return;
      }

      googleIdToken = savedToken;
      accountInfo.textContent = 'Login sebagai: ' + email;
      startButton.disabled = false;
      document.getElementById('googleLogin').style.display = 'none';

      showMessage(
        'SESI LOGIN DIPULIHKAN.\nMemeriksa antrean absensi...',
        'success'
      );
      syncPendingAttendanceQueue();
    }

    window.addEventListener('load', () => {
      initializeGoogleLogin();
      initializePhotoHistoryReset();
    });

    // =====================================
    // DETEKSI PERANGKAT
    // =====================================

    function detectDevice() {
      const ua = navigator.userAgent;

      if (/iPad|Android/i.test(ua) ||
          (navigator.maxTouchPoints > 1 &&
           Math.min(screen.width, screen.height) >= 600)) {
        return 'TABLET';
      }

      if (/Mobile|iPhone|iPod/i.test(ua)) return 'HP';

      return 'KOMPUTER';
    }

    // =====================================
    // AMBIL TOKEN QR
    // =====================================

    function extractToken(decodedText) {
      try {
        return new URL(decodedText).searchParams.get('token') || '';
      } catch (error) {
        return '';
      }
    }

    // =====================================
    // ANTREAN ABSENSI LOKAL (INDEXEDDB)
    // =====================================
    const ATTENDANCE_DB_NAME = 'GLOBALINDO_ABSENSI_DB';
    const ATTENDANCE_STORE = 'pending_attendance';
    let attendanceDbPromise = null;
    let isSyncingAttendanceQueue = false;

    function openAttendanceDb() {
      if (attendanceDbPromise) return attendanceDbPromise;
      attendanceDbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('Browser tidak mendukung penyimpanan antrean lokal.'));
          return;
        }
        const request = indexedDB.open(ATTENDANCE_DB_NAME, 1);
        request.onupgradeneeded = event => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(ATTENDANCE_STORE)) {
            db.createObjectStore(ATTENDANCE_STORE, { keyPath: 'requestId' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Gagal membuka antrean lokal.'));
      });
      return attendanceDbPromise;
    }

    async function savePendingAttendance(item) {
      const db = await openAttendanceDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(ATTENDANCE_STORE, 'readwrite');
        tx.objectStore(ATTENDANCE_STORE).put(item);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error || new Error('Gagal menyimpan antrean absensi.'));
        tx.onabort = () => reject(tx.error || new Error('Penyimpanan antrean dibatalkan.'));
      });
    }

    async function removePendingAttendance(requestId) {
      const db = await openAttendanceDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(ATTENDANCE_STORE, 'readwrite');
        tx.objectStore(ATTENDANCE_STORE).delete(requestId);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error || new Error('Gagal memperbarui antrean.'));
      });
    }

    async function getPendingAttendance() {
      const db = await openAttendanceDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(ATTENDANCE_STORE, 'readonly');
        const request = tx.objectStore(ATTENDANCE_STORE).getAll();
        request.onsuccess = () => resolve((request.result || []).sort((a, b) => a.createdAt - b.createdAt));
        request.onerror = () => reject(request.error || new Error('Gagal membaca antrean absensi.'));
      });
    }

    async function syncPendingAttendanceQueue() {
      if (isSyncingAttendanceQueue || !googleIdToken || !navigator.onLine) return;
      isSyncingAttendanceQueue = true;
      try {
        const pending = await getPendingAttendance();
        for (const item of pending) {
          if (!googleIdToken || !navigator.onLine) break;
          try {
            const response = await requestAttendanceWithRetry(item.token, item.requestId);
            if (!response || !response.success) {
              throw new Error((response && response.message) || 'Server belum menerima absensi.');
            }
            await removePendingAttendance(item.requestId);
            console.info('ABSENSI ANTREAN BERHASIL DISINKRONKAN:', item.requestId);
          } catch (error) {
            console.warn('ANTREAN ABSENSI MASIH MENUNGGU:', item.requestId, error);
            break; // Jaga urutan MASUK/PULANG; jangan lewati transaksi terlama.
          }
        }
      } catch (error) {
        console.error('GAGAL MEMERIKSA ANTREAN ABSENSI:', error);
      } finally {
        isSyncingAttendanceQueue = false;
      }
    }

    window.addEventListener('online', () => {
      if (googleIdToken) syncPendingAttendanceQueue();
    });

    // =====================================
    // RESET SCANNER
    // =====================================

    async function resetScanner() {
      // Lepaskan kunci scan segera setelah kamera siap kembali.
      isProcessing = false;
      if (!googleIdToken) return;

      try {
        if (!scanner || !scanner.isScanning) {
          await startScanner();
        }
        showMessage(
          'KAMERA AKTIF\nSilakan pindai QR berikutnya.',
          'success'
        );
      } catch (error) {
        showMessage(
          'KAMERA GAGAL DIAKTIFKAN.\n' + error.message,
          'error'
        );
      }
    }

    // Kirim ulang hanya jika koneksi/response terputus.
    // requestId yang sama membuat server mengembalikan catatan lama,
    // bukan membuat absensi kedua.
    function requestAttendanceOnce(token, requestId) {
      return new Promise((resolve, reject) => {
        const callbackName = 'attendanceCallback';
        const script = document.createElement('script');
        let finished = false;

        const timeout = setTimeout(() => {
          if (finished) return;
          finished = true;
          delete window[callbackName];
          script.remove();
          reject(new Error('Server belum memberikan respons.'));
        }, 30000);

        window[callbackName] = result => {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
          resolve(result);
        };

        const params = new URLSearchParams({
          action: 'scan',
          token: token,
          device: detectDevice(),
          id_token: googleIdToken,
          requestId: requestId,
          callback: callbackName
        });

        script.src = SCRIPT_URL + '?' + params.toString();
        script.onerror = () => {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
          reject(new Error('Koneksi ke server terputus.'));
        };

        document.body.appendChild(script);
      });
    }

    async function requestAttendanceWithRetry(token, requestId) {
      try {
        return await requestAttendanceOnce(token, requestId);
      } catch (firstError) {
        showMessage(
          'KONEKSI TERGANGGU.\nMemastikan status absensi ke server...',
          'loading'
        );
        // Percobaan kedua memakai ID permintaan yang sama.
        return await requestAttendanceOnce(token, requestId);
      }
    }

    // =====================================
    // KIRIM ABSENSI
    // =====================================

    async function sendAttendance(token) {
      if (!googleIdToken) {
        showMessage('Silakan login Google terlebih dahulu.', 'error');
        isProcessing = false;
        return;
      }

      const requestId = (
        window.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now() + '_' + Math.random().toString(36).slice(2)
      );

      let attendanceSaved = false;
      let queuedLocally = false;
      try {
        // Cegah QR yang sama dibuat menjadi transaksi baru ketika transaksi
        // sebelumnya masih menunggu sinkronisasi.
        const existingPending = await getPendingAttendance();
        if (existingPending.some(item => item.token === token)) {
          showMessage(
            'QR INI MASIH DALAM ANTREAN.\nAbsensi sebelumnya belum tersinkron ke server. Jangan scan ulang.',
            'error'
          );
          showAttendanceNotification(
            '⌛ ABSENSI MASIH MENUNGGU',
            'QR karyawan ini sudah memiliki transaksi yang menunggu server.',
            'error'
          );
          return;
        }

        // Simpan lebih dahulu ke tablet agar scan tidak hilang saat server timeout.
        await savePendingAttendance({
          requestId: requestId,
          token: token,
          createdAt: Date.now(),
          scannedAt: new Date().toISOString(),
          status: 'PENDING'
        });
        queuedLocally = true;

        showMessage('ABSENSI TERSIMPAN DI TABLET.\nMengirim ke server...', 'loading');
        const response = await requestAttendanceWithRetry(token, requestId);

        if (!response || !response.success) {
          const errorMessage = response && response.message
            ? response.message
            : 'Respons server tidak valid.';

          if (/login google tidak valid|sesi login google sudah kedaluwarsa|silakan login/i.test(errorMessage)) {
            googleIdToken = '';
            startButton.disabled = true;
            document.getElementById('googleLogin').style.display = 'flex';
            accountInfo.textContent = 'Sesi login berakhir. Silakan login kembali.';
            try { sessionStorage.removeItem('absensi_google_id_token'); } catch (storageError) {}
          }
          throw new Error(errorMessage);
        }

        attendanceSaved = true;
        await removePendingAttendance(requestId);
        queuedLocally = false;
        showMessage(
          'ABSENSI BERHASIL!\n\n' +
          'Nama: ' + response.name + '\n' +
          'Departemen: ' + response.department + '\n' +
          'Aktivitas: ' + response.activity + '\n' +
          'Tanggal: ' + response.date + '\n' +
          'Jam: ' + response.time,
          'success'
        );

        showAttendanceNotification(
          '✓ ABSENSI ' + String(response.activity || 'BERHASIL').toUpperCase(),
          (response.name || 'Nama karyawan tidak tersedia') +
            (response.id || response.employeeId ? ' · ' + (response.id || response.employeeId) : '') +
            '\n' + (response.department || '-') +
            ' · ' + (response.time || '-') +
            ' · ' + (response.date || '-'),
          'success'
        );

        const queueItem = addPhotoQueueItem(response);
        updatePhotoState(requestId, 'Absensi tercatat. Mengambil foto wajah...', '');

        // Hentikan kamera belakang hanya saat kamera depan akan dipakai.
        if (scanner && scanner.isScanning) {
          await scanner.stop();
        }

        try {
          const imageData = await captureFacePhoto();
          const preview = document.createElement('img');
          preview.src = imageData;
          preview.alt = 'Foto absensi ' + (response.name || '');
          queueItem.insertBefore(preview, queueItem.querySelector('.upload-state'));

          updatePhotoState(requestId, 'Foto siap. Mengirim ke Google Drive...', '');

          // Upload berjalan di latar belakang. Tidak ditunggu di sini.
          startBackgroundPhotoUpload(imageData, requestId, token);
        } catch (photoError) {
          updatePhotoState(
            requestId,
            'Absensi sudah tercatat, tetapi foto gagal diambil: ' +
              (photoError.message || photoError),
            'failed'
          );
          console.error('ERROR AMBIL FOTO:', photoError);
        }

      } catch (error) {
        const failureText = error.message || String(error);
        showMessage(
          attendanceSaved
            ? 'ABSENSI TERCATAT.'
            : (queuedLocally
                ? 'ABSENSI TERSIMPAN SEMENTARA DI TABLET.\nAkan dikirim ulang saat server tersedia.\n' + failureText
                : 'ABSENSI GAGAL DISIMPAN.\n' + failureText),
          (attendanceSaved || queuedLocally) ? 'success' : 'error'
        );

        if (!attendanceSaved && queuedLocally) {
          showAttendanceNotification(
            '⌛ ABSENSI MASUK ANTREAN',
            'Data tersimpan di tablet dan menunggu server. Jangan scan ulang QR yang sama.',
            'success'
          );
        } else if (!attendanceSaved) {
          showAttendanceNotification('✕ ABSENSI GAGAL', failureText, 'error');
        } else {
          showAttendanceNotification(
            '✓ ABSENSI TETAP TERCATAT',
            'Foto belum berhasil diproses. ' + failureText,
            'success'
          );
        }

        console.error('ERROR ABSENSI:', error);
      } finally {
        // Scanner dinyalakan kembali setelah kamera depan selesai dipakai.
        // Upload Drive tetap berjalan terpisah dan tidak ditunggu.
        await resetScanner();
      }
    }

        // =====================================
    // QR BERHASIL DIPINDAI
    // =====================================

    function onScanSuccess(decodedText) {
      const now = Date.now();

      if (isProcessing || now - lastScanTime < 2000) return;

      const token = extractToken(decodedText);

      if (!token) {
        lastScanTime = now;
        showMessage('QR TIDAK VALID.', 'error');
        showAttendanceNotification(
          '✕ QR TIDAK VALID',
          'QR tidak dikenali. Silakan gunakan kartu QR karyawan yang benar.',
          'error'
        );
        return;
      }

      isProcessing = true;
      lastScanTime = now;

      showMessage('MEMPROSES ABSENSI...', 'loading');
      sendAttendance(token);
    }

    // =====================================
    // MULAI SCANNER
    // =====================================

    async function startScanner() {
      if (!googleIdToken) {
        showMessage('Login Google terlebih dahulu.', 'error');
        return;
      }

      startButton.disabled = true;

      try {
        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 15,
            qrbox: { width: 250, height: 250 }
          },
          onScanSuccess
        );

        showMessage(
          'KAMERA AKTIF.\nARAHKAN KE QR KARYAWAN.',
          'success'
        );

        startButton.style.display = 'none';

      } catch (error) {
        showMessage(
          'KAMERA GAGAL DIAKTIFKAN.\n' + error.message,
          'error'
        );

        startButton.disabled = false;
      }
    }
  </script>
