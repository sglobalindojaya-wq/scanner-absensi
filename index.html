<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi - Globalindo Jaya</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
    }

    h2 { color: #b5121b; }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #status {
      padding: 15px;
      border-radius: 10px;
      white-space: pre-line;
      background: #eee;
      margin: 15px 0;
      line-height: 1.5;
    }

    .success {
      background: #d1fae5 !important;
      color: #065f46;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .loading {
      background: #e5e7eb !important;
      color: #333;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #b5121b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #googleLogin {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    #accountInfo {
      font-size: 13px;
      color: #555;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">

  <h2>ABSENSI PABRIK</h2>
  <p>PT SHARK GLOBALINDO JAYA</p>

  <div id="googleLogin"></div>
  <p id="accountInfo">Silakan login dengan akun resmi.</p>

  <!-- SCANNER QR KAMERA BELAKANG -->
  <div id="reader"></div>

  <!-- KAMERA DEPAN UNTUK FOTO WAJAH -->
  <video id="faceCamera" autoplay playsinline muted
         style="display:none;"></video>

  <canvas id="faceCanvas" style="display:none;"></canvas>

  <div id="status" class="loading">
    Menunggu login Google.
  </div>

  <button id="startButton" onclick="startScanner()" disabled>
    MULAI SCANNER
  </button>

</div>

  <script>
    // =====================================
    // KONFIGURASI
    // =====================================

    const SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbzayrDVV0TCJHTdRDo59xPsb7CmXyi8y0TiTVTWmCkbqdo-pdrd3IoKLn39B3Iy7Uck/exec';

    const GOOGLE_CLIENT_ID =
      '373449956803-0d4oljbn26l1esnfkm427k0dj8t4hcq3.apps.googleusercontent.com';

    const OFFICIAL_EMAIL = 'sglobalindojaya@gmail.com';

    // =====================================
    // VARIABEL
    // =====================================

    const statusBox = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const accountInfo = document.getElementById('accountInfo');

    const faceCamera = document.getElementById('faceCamera');
    const faceCanvas = document.getElementById('faceCanvas');

    let scanner = null;
    let isProcessing = false;
    let lastScanTime = 0;
    let googleIdToken = '';
    
    let faceStream = null;
    let isCapturingFace = false;

    
async function captureFacePhoto() {
  if (isCapturingFace) {
    throw new Error('Kamera sedang mengambil foto.');
  }

  isCapturingFace = true;

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Browser tidak mendukung akses kamera.');
    }

    showMessage('MEMBUKA KAMERA DEPAN...', 'loading');

    faceStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'user' },
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    faceCamera.srcObject = faceStream;
    faceCamera.style.display = 'block';

    await faceCamera.play();

    // Tunggu sampai kamera menghasilkan gambar.
    await new Promise((resolve, reject) => {
      const start = Date.now();

      function checkCamera() {
        if (
          faceCamera.readyState >= 2 &&
          faceCamera.videoWidth > 0 &&
          faceCamera.videoHeight > 0
        ) {
          resolve();
          return;
        }

        if (Date.now() - start > 10000) {
          reject(new Error('Kamera depan gagal menghasilkan gambar.'));
          return;
        }

        requestAnimationFrame(checkCamera);
      }

      checkCamera();
    });

    showMessage('MENGAMBIL FOTO WAJAH...', 'loading');

    const context = faceCanvas.getContext('2d');

    faceCanvas.width = faceCamera.videoWidth;
    faceCanvas.height = faceCamera.videoHeight;

    context.drawImage(
      faceCamera,
      0,
      0,
      faceCanvas.width,
      faceCanvas.height
    );

    const imageData = faceCanvas.toDataURL('image/jpeg', 0.7);

    if (!imageData || imageData.length < 1000) {
      throw new Error('Foto gagal dibuat.');
    }

    return imageData;

  } finally {
    if (faceStream) {
      faceStream.getTracks().forEach(track => track.stop());
      faceStream = null;
    }

    faceCamera.srcObject = null;
    faceCamera.style.display = 'none';
    isCapturingFace = false;
  }
}
async function uploadFacePhoto(imageData, requestId, token) {
  if (!imageData || !requestId || !token) {
    throw new Error('Data foto tidak lengkap.');
  }

  const iframe = document.createElement('iframe');
  const frameName = 'uploadFrame_' + requestId;
  iframe.name = frameName;
  iframe.style.display = 'none';

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = SCRIPT_URL;
  form.target = frameName;
  form.enctype = 'application/x-www-form-urlencoded';
  form.style.display = 'none';

  const payload = {
    action: 'uploadPhoto',
    requestId: requestId,
    token: token,
    imageData: imageData
  };

  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'payload';
  input.value = JSON.stringify(payload);
  form.appendChild(input);

  try {
    // Tunggu iframe siap lebih dahulu agar event load awal tidak
    // dianggap sebagai tanda bahwa POST sudah selesai.
    const iframeReady = new Promise((resolve, reject) => {
      const readyTimeout = setTimeout(
        () => reject(new Error('Frame upload gagal disiapkan.')),
        10000
      );
      iframe.addEventListener('load', function onInitialLoad() {
        clearTimeout(readyTimeout);
        resolve();
      }, { once: true });
    });

    document.body.appendChild(iframe);
    document.body.appendChild(form);
    await iframeReady;

    const uploadFinished = new Promise((resolve, reject) => {
      const uploadTimeout = setTimeout(
        () => reject(new Error('Waktu pengiriman foto habis.')),
        45000
      );

      iframe.addEventListener('load', function onUploadLoad() {
        clearTimeout(uploadTimeout);
        resolve();
      }, { once: true });
    });

    form.submit();
    await uploadFinished;

    // Konfirmasi dilakukan melalui JSONP karena halaman GitHub
    // dan Google Apps Script berada pada domain berbeda.
    for (let attempt = 0; attempt < 15; attempt++) {
      const callbackName =
        'photoStatusCallback_' + Date.now() + '_' + attempt;

      const result = await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        let settled = false;

        const finish = (callback, value) => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
          callback(value);
        };

        const timeout = setTimeout(() => {
          finish(reject, new Error(
            'Server tidak merespons saat memeriksa status foto.'
          ));
        }, 10000);

        window[callbackName] = response => finish(resolve, response);

        const params = new URLSearchParams({
          action: 'photostatus',
          requestId: requestId,
          token: token,
          callback: callbackName
        });

        script.src = SCRIPT_URL + '?' + params.toString();
        script.onerror = () => finish(reject, new Error(
          'Gagal menghubungi server untuk konfirmasi foto.'
        ));

        document.body.appendChild(script);
      });

      if (result && result.success) return result;

      if (result && result.message &&
          result.message !== 'Foto belum tersimpan.') {
        throw new Error(result.message);
      }

      await new Promise(resolve => setTimeout(resolve, 1000));
    }

    throw new Error(
      'Foto belum terkonfirmasi tersimpan di Google Drive. Periksa izin folder Drive dan deployment Apps Script.'
    );

  } finally {
    form.remove();
    iframe.remove();
  }
}

        // =====================================
    // TAMPILAN STATUS
    // =====================================

    function showMessage(message, type) {
      statusBox.className = type;
      statusBox.textContent = message;
    }

    // =====================================
    // DECODE EMAIL UNTUK TAMPILAN
    // VERIFIKASI ASLI TETAP DI SERVER
    // =====================================

    function getEmailFromCredential(jwt) {
      try {
        const payload = jwt.split('.')[1];
        const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
        const decoded = atob(normalized);
        const bytes = Uint8Array.from(decoded, c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes)).email || '';
      } catch (error) {
        return '';
      }
    }

    // =====================================
    // LOGIN GOOGLE
    // =====================================

    function initializeGoogleLogin() {
      if (!window.google || !google.accounts) {
        setTimeout(initializeGoogleLogin, 500);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleLogin,
        auto_select: true
      });

      // Pulihkan sesi dari tab yang sama setelah halaman di-refresh.
      // Token tetap diverifikasi ulang oleh server saat scan.
      restoreGoogleSession();

      google.accounts.id.renderButton(
        document.getElementById('googleLogin'),
        {
          theme: 'outline',
          size: 'large',
          shape: 'rectangular',
          text: 'signin_with',
          width: 280
        }
      );
    }

    function handleGoogleLogin(response) {
      const credential = response.credential;
      const email = getEmailFromCredential(credential).toLowerCase();

      if (email !== OFFICIAL_EMAIL) {
        googleIdToken = '';
        startButton.disabled = true;

        accountInfo.textContent = 'Akun tidak diizinkan: ' + (email || 'tidak diketahui');

        showMessage(
          'LOGIN DITOLAK!\nGunakan akun ' + OFFICIAL_EMAIL,
          'error'
        );
        return;
      }

      googleIdToken = credential;

      try {
        sessionStorage.setItem('absensi_google_id_token', credential);
      } catch (storageError) {
        // Login tetap dapat dipakai selama halaman tidak di-refresh.
      }

      accountInfo.textContent = 'Login sebagai: ' + email;
      startButton.disabled = false;
      document.getElementById('googleLogin').style.display = 'none';

      showMessage(
        'LOGIN BERHASIL.\nSilakan aktifkan scanner.',
        'success'
      );
    }

    function restoreGoogleSession() {
      let savedToken = '';

      try {
        savedToken = sessionStorage.getItem('absensi_google_id_token') || '';
      } catch (storageError) {
        savedToken = '';
      }

      if (!savedToken) return;

      const email = getEmailFromCredential(savedToken).toLowerCase();

      let payload = {};
      try {
        const part = savedToken.split('.')[1];
        const normalized = part.replace(/-/g, '+').replace(/_/g, '/');
        const decoded = atob(normalized);
        const bytes = Uint8Array.from(decoded, c => c.charCodeAt(0));
        payload = JSON.parse(new TextDecoder().decode(bytes));
      } catch (error) {
        payload = {};
      }

      const stillValid = Number(payload.exp || 0) >
        Math.floor(Date.now() / 1000);

      if (email !== OFFICIAL_EMAIL || !stillValid) {
        try {
          sessionStorage.removeItem('absensi_google_id_token');
        } catch (storageError) {}
        return;
      }

      googleIdToken = savedToken;
      accountInfo.textContent = 'Login sebagai: ' + email;
      startButton.disabled = false;
      document.getElementById('googleLogin').style.display = 'none';

      showMessage(
        'SESI LOGIN DIPULIHKAN.\nSilakan klik MULAI SCANNER.',
        'success'
      );
    }

    window.addEventListener('load', initializeGoogleLogin);

    // =====================================
    // DETEKSI PERANGKAT
    // =====================================

    function detectDevice() {
      const ua = navigator.userAgent;

      if (/iPad|Android/i.test(ua) ||
          (navigator.maxTouchPoints > 1 &&
           Math.min(screen.width, screen.height) >= 600)) {
        return 'TABLET';
      }

      if (/Mobile|iPhone|iPod/i.test(ua)) return 'HP';

      return 'KOMPUTER';
    }

    // =====================================
    // AMBIL TOKEN QR
    // =====================================

    function extractToken(decodedText) {
      try {
        return new URL(decodedText).searchParams.get('token') || '';
      } catch (error) {
        return '';
      }
    }

    // =====================================
    // RESET SCANNER
    // =====================================

    async function resetScanner() {
      setTimeout(async function() {
        isProcessing = false;
    
        if (googleIdToken) {
          try {
            if (!scanner || !scanner.isScanning) {
              await startScanner();
            }
    
            showMessage(
              'KAMERA AKTIF\nSilakan pindai QR berikutnya.',
              'success'
            );
    
          } catch (error) {
            showMessage(
              'KAMERA GAGAL DIAKTIFKAN.\n' + error.message,
              'error'
            );
          }
        }
      }, 1500);
    }

    // =====================================
    // KIRIM ABSENSI
    // =====================================

    async function sendAttendance(token) {
      if (!googleIdToken) {
        showMessage('Silakan login Google terlebih dahulu.', 'error');
        isProcessing = false;
        return;
      }

            // Buat ID unik untuk menghubungkan foto dengan absensi.
            const requestId = (
              window.crypto && crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now() + '_' + Math.random().toString(36).slice(2)
            );
      
            // Ambil foto wajah menggunakan kamera depan.
            try {
          showMessage('MENGHENTIKAN KAMERA SCANNER...', 'loading');
        
          // Hentikan kamera belakang sementara.
          if (scanner && scanner.isScanning) {
            await scanner.stop();
          }
        
          showMessage('MENGAMBIL FOTO WAJAH...', 'loading');
        
          // Aktifkan kamera depan dan ambil foto.
          const imageData = await captureFacePhoto();
        
          showMessage('MENGUNGGAH FOTO...', 'loading');
        
          await uploadFacePhoto(imageData, requestId, token);
        
        } catch (error) {
          showMessage(
            'GAGAL MENGAMBIL / MENGIRIM FOTO!\n' +
            (error.message || error),
            'error'
          );
        
          console.error('ERROR FOTO:', error);
          isProcessing = false;
        
          return;
        }

      // Harus sama persis dengan callback yang diizinkan oleh doGet(e) di Kode.gs.
      const callbackName = 'attendanceCallback';

      const script = document.createElement('script');
      let finished = false;

      const timeout = setTimeout(function() {
        if (finished) return;

        finished = true;
        delete window[callbackName];
        script.remove();

        showMessage(
          'SERVER TIDAK MEMBERIKAN RESPONS.\nPeriksa koneksi internet.',
          'error'
        );

        resetScanner();
      }, 15000);

      window[callbackName] = function(response) {
        if (finished) return;

        finished = true;
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();

        if (response && response.success) {
          showMessage(
            'ABSENSI BERHASIL!\n\n' +
            'Nama: ' + response.name + '\n' +
            'Departemen: ' + response.department + '\n' +
            'Aktivitas: ' + response.activity + '\n' +
            'Tanggal: ' + response.date + '\n' +
            'Jam: ' + response.time,
            'success'
          );
        } else {
          const errorMessage = response && response.message
            ? response.message
            : 'Respons server tidak valid.';

          if (/login google tidak valid|sesi login google sudah kedaluwarsa|silakan login/i.test(errorMessage)) {
            googleIdToken = '';
            startButton.disabled = true;
            document.getElementById('googleLogin').style.display = 'flex';
            accountInfo.textContent = 'Sesi login berakhir. Silakan login kembali.';
            try {
              sessionStorage.removeItem('absensi_google_id_token');
            } catch (storageError) {}
          }

          showMessage('ABSENSI GAGAL!\n' + errorMessage, 'error');
        }

        resetScanner();
      };

      const params = new URLSearchParams({
        action: 'scan',
        token: token,
        device: detectDevice(),
        id_token: googleIdToken,
        requestId: requestId,
        callback: callbackName
      });

      script.src = SCRIPT_URL + '?' + params.toString();

      script.onerror = function() {
        if (finished) return;

        finished = true;
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();

        showMessage('GAGAL MENGHUBUNGI SERVER ABSENSI.', 'error');
        resetScanner();
      };

      document.body.appendChild(script);
    }

    // =====================================
    // QR BERHASIL DIPINDAI
    // =====================================

    function onScanSuccess(decodedText) {
      const now = Date.now();

      if (isProcessing || now - lastScanTime < 2000) return;

      const token = extractToken(decodedText);

      if (!token) {
        lastScanTime = now;
        showMessage('QR TIDAK VALID.', 'error');
        return;
      }

      isProcessing = true;
      lastScanTime = now;

      showMessage('MEMPROSES ABSENSI...', 'loading');
      sendAttendance(token);
    }

    // =====================================
    // MULAI SCANNER
    // =====================================

    async function startScanner() {
      if (!googleIdToken) {
        showMessage('Login Google terlebih dahulu.', 'error');
        return;
      }

      startButton.disabled = true;

      try {
        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 15,
            qrbox: { width: 250, height: 250 }
          },
          onScanSuccess
        );

        showMessage(
          'KAMERA AKTIF.\nARAHKAN KE QR KARYAWAN.',
          'success'
        );

        startButton.style.display = 'none';

      } catch (error) {
        showMessage(
          'KAMERA GAGAL DIAKTIFKAN.\n' + error.message,
          'error'
        );

        startButton.disabled = false;
      }
    }
  </script>
</body>
</html>
