<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi - Globalindo Jaya</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
    }

    h2 { color: #b5121b; }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #status {
      padding: 15px;
      border-radius: 10px;
      white-space: pre-line;
      background: #eee;
      margin: 15px 0;
      line-height: 1.5;
    }

    .success {
      background: #d1fae5 !important;
      color: #065f46;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .loading {
      background: #e5e7eb !important;
      color: #333;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #b5121b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #googleLogin {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    #accountInfo {
      font-size: 13px;
      color: #555;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>ABSENSI PABRIK</h2>
    <p>PT SHARK GLOBALINDO JAYA</p>

    <div id="googleLogin"></div>
    <p id="accountInfo">Silakan login dengan akun resmi.</p>

    <div id="reader"></div>

    <div id="status" class="loading">
      Menunggu login Google.
    </div>

    <button id="startButton" onclick="startScanner()" disabled>
      MULAI SCANNER
    </button>

  </div>

  <script>
    // =====================================
    // KONFIGURASI
    // =====================================

    const SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbw2pWUAGwOgeR9yoWZie2yJzhysW8n31qzyaKDzWLiSpWr59YyCwkxeTZjSgg-KjtZS/exec';

    const GOOGLE_CLIENT_ID =
      '373449956803-0d4oljbn26l1esnfkm427k0dj8t4hcq3.apps.googleusercontent.com';

    const OFFICIAL_EMAIL = 'sglobalindojaya@gmail.com';

    // =====================================
    // VARIABEL
    // =====================================

    const statusBox = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const accountInfo = document.getElementById('accountInfo');

    let scanner = null;
    let isProcessing = false;
    let lastScanTime = 0;
    let googleIdToken = '';

    // =====================================
    // TAMPILAN STATUS
    // =====================================

    function showMessage(message, type) {
      statusBox.className = type;
      statusBox.textContent = message;
    }

    // =====================================
    // DECODE EMAIL UNTUK TAMPILAN
    // VERIFIKASI ASLI TETAP DI SERVER
    // =====================================

    function getEmailFromCredential(jwt) {
      try {
        const payload = jwt.split('.')[1];
        const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
        const decoded = atob(normalized);
        const bytes = Uint8Array.from(decoded, c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes)).email || '';
      } catch (error) {
        return '';
      }
    }

    // =====================================
    // LOGIN GOOGLE
    // =====================================

    function initializeGoogleLogin() {
      if (!window.google || !google.accounts) {
        setTimeout(initializeGoogleLogin, 500);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleLogin,
        auto_select: true
      });

      // Pulihkan sesi dari tab yang sama setelah halaman di-refresh.
      // Token tetap diverifikasi ulang oleh server saat scan.
      restoreGoogleSession();

      google.accounts.id.renderButton(
        document.getElementById('googleLogin'),
        {
          theme: 'outline',
          size: 'large',
          shape: 'rectangular',
          text: 'signin_with',
          width: 280
        }
      );
    }

    function handleGoogleLogin(response) {
      const credential = response.credential;
      const email = getEmailFromCredential(credential).toLowerCase();

      if (email !== OFFICIAL_EMAIL) {
        googleIdToken = '';
        startButton.disabled = true;

        accountInfo.textContent = 'Akun tidak diizinkan: ' + (email || 'tidak diketahui');

        showMessage(
          'LOGIN DITOLAK!\nGunakan akun ' + OFFICIAL_EMAIL,
          'error'
        );
        return;
      }

      googleIdToken = credential;

      try {
        sessionStorage.setItem('absensi_google_id_token', credential);
      } catch (storageError) {
        // Login tetap dapat dipakai selama halaman tidak di-refresh.
      }

      accountInfo.textContent = 'Login sebagai: ' + email;
      startButton.disabled = false;
      document.getElementById('googleLogin').style.display = 'none';

      showMessage(
        'LOGIN BERHASIL.\nSilakan aktifkan scanner.',
        'success'
      );
    }

    function restoreGoogleSession() {
      let savedToken = '';

      try {
        savedToken = sessionStorage.getItem('absensi_google_id_token') || '';
      } catch (storageError) {
        savedToken = '';
      }

      if (!savedToken) return;

      const email = getEmailFromCredential(savedToken).toLowerCase();

      let payload = {};
      try {
        const part = savedToken.split('.')[1];
        const normalized = part.replace(/-/g, '+').replace(/_/g, '/');
        const decoded = atob(normalized);
        const bytes = Uint8Array.from(decoded, c => c.charCodeAt(0));
        payload = JSON.parse(new TextDecoder().decode(bytes));
      } catch (error) {
        payload = {};
      }

      const stillValid = Number(payload.exp || 0) >
        Math.floor(Date.now() / 1000);

      if (email !== OFFICIAL_EMAIL || !stillValid) {
        try {
          sessionStorage.removeItem('absensi_google_id_token');
        } catch (storageError) {}
        return;
      }

      googleIdToken = savedToken;
      accountInfo.textContent = 'Login sebagai: ' + email;
      startButton.disabled = false;
      document.getElementById('googleLogin').style.display = 'none';

      showMessage(
        'SESI LOGIN DIPULIHKAN.\nSilakan klik MULAI SCANNER.',
        'success'
      );
    }

    window.addEventListener('load', initializeGoogleLogin);

    // =====================================
    // DETEKSI PERANGKAT
    // =====================================

    function detectDevice() {
      const ua = navigator.userAgent;

      if (/iPad|Android/i.test(ua) ||
          (navigator.maxTouchPoints > 1 &&
           Math.min(screen.width, screen.height) >= 600)) {
        return 'TABLET';
      }

      if (/Mobile|iPhone|iPod/i.test(ua)) return 'HP';

      return 'KOMPUTER';
    }

    // =====================================
    // AMBIL TOKEN QR
    // =====================================

    function extractToken(decodedText) {
      try {
        return new URL(decodedText).searchParams.get('token') || '';
      } catch (error) {
        return '';
      }
    }

    // =====================================
    // RESET SCANNER
    // =====================================

    function resetScanner() {
      setTimeout(function() {
        isProcessing = false;

        if (googleIdToken) {
          showMessage(
            'KAMERA AKTIF\nSilakan pindai QR berikutnya.',
            'loading'
          );
        }
      }, 1500);
    }

    // =====================================
    // KIRIM ABSENSI
    // =====================================

    function sendAttendance(token) {
      if (!googleIdToken) {
        showMessage('Silakan login Google terlebih dahulu.', 'error');
        isProcessing = false;
        return;
      }

      // Harus sama persis dengan callback yang diizinkan oleh doGet(e) di Kode.gs.
      const callbackName = 'attendanceCallback';

      const script = document.createElement('script');
      let finished = false;

      const timeout = setTimeout(function() {
        if (finished) return;

        finished = true;
        delete window[callbackName];
        script.remove();

        showMessage(
          'SERVER TIDAK MEMBERIKAN RESPONS.\nPeriksa koneksi internet.',
          'error'
        );

        resetScanner();
      }, 15000);

      window[callbackName] = function(response) {
        if (finished) return;

        finished = true;
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();

        if (response && response.success) {
          showMessage(
            'ABSENSI BERHASIL!\n\n' +
            'Nama: ' + response.name + '\n' +
            'Departemen: ' + response.department + '\n' +
            'Aktivitas: ' + response.activity + '\n' +
            'Tanggal: ' + response.date + '\n' +
            'Jam: ' + response.time,
            'success'
          );
        } else {
          const errorMessage = response && response.message
            ? response.message
            : 'Respons server tidak valid.';

          if (/login google tidak valid|sesi login google sudah kedaluwarsa|silakan login/i.test(errorMessage)) {
            googleIdToken = '';
            startButton.disabled = true;
            document.getElementById('googleLogin').style.display = 'flex';
            accountInfo.textContent = 'Sesi login berakhir. Silakan login kembali.';
            try {
              sessionStorage.removeItem('absensi_google_id_token');
            } catch (storageError) {}
          }

          showMessage('ABSENSI GAGAL!\n' + errorMessage, 'error');
        }

        resetScanner();
      };

      const params = new URLSearchParams({
        action: 'scan',
        token: token,
        device: detectDevice(),
        id_token: googleIdToken,
        callback: callbackName
      });

      script.src = SCRIPT_URL + '?' + params.toString();

      script.onerror = function() {
        if (finished) return;

        finished = true;
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();

        showMessage('GAGAL MENGHUBUNGI SERVER ABSENSI.', 'error');
        resetScanner();
      };

      document.body.appendChild(script);
    }

    // =====================================
    // QR BERHASIL DIPINDAI
    // =====================================

    function onScanSuccess(decodedText) {
      const now = Date.now();

      if (isProcessing || now - lastScanTime < 2000) return;

      const token = extractToken(decodedText);

      if (!token) {
        lastScanTime = now;
        showMessage('QR TIDAK VALID.', 'error');
        return;
      }

      isProcessing = true;
      lastScanTime = now;

      showMessage('MEMPROSES ABSENSI...', 'loading');
      sendAttendance(token);
    }

    // =====================================
    // MULAI SCANNER
    // =====================================

    async function startScanner() {
      if (!googleIdToken) {
        showMessage('Login Google terlebih dahulu.', 'error');
        return;
      }

      startButton.disabled = true;

      try {
        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 15,
            qrbox: { width: 250, height: 250 }
          },
          onScanSuccess
        );

        showMessage(
          'KAMERA AKTIF.\nARAHKAN KE QR KARYAWAN.',
          'success'
        );

        startButton.style.display = 'none';

      } catch (error) {
        showMessage(
          'KAMERA GAGAL DIAKTIFKAN.\n' + error.message,
          'error'
        );

        startButton.disabled = false;
      }
    }
  </script>
</body>
</html>
